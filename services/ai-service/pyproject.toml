[project]
name = "lafo-ai-service"
version = "0.1.0"
description = "Local AI File Organizer - classification/extraction/embedding service (fully local)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "pypdf>=4.0,<6.0",
    "python-docx>=1.1,<2.0",
    "pytesseract>=0.3.10,<0.4",
    "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
pdf = []
docx = []
embeddings = ["sentence-transformers>=2.6,<4.0"]
ocr = []
numpy = ["numpy>=1.24,<3.0"]
all = [
    "sentence-transformers>=2.6,<4.0",
    "numpy>=1.24,<3.0",
]

[project.scripts]
lafo-ai-service = "app.main:run"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
